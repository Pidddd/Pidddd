<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Design in Figma</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="998" height="378" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="378" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="998" height="378" rx="20" fill="url(#glow)"/>

  <!-- figma logo -->
  <g transform="translate(50,48)">
    <path d="M19 28.5a9.5 9.5 0 1 1 19 0 9.5 9.5 0 0 1-19 0z" fill="#1ABCFE"/>
    <path d="M0 47.5A9.5 9.5 0 0 1 9.5 38H19v9.5a9.5 9.5 0 1 1-19 0z" fill="#0ACF83"/>
    <path d="M19 0v19h9.5a9.5 9.5 0 1 0 0-19H19z" fill="#FF7262"/>
    <path d="M0 9.5A9.5 9.5 0 0 0 9.5 19H19V0H9.5A9.5 9.5 0 0 0 0 9.5z" fill="#F24E1E"/>
    <path d="M0 28.5A9.5 9.5 0 0 0 9.5 38H19V19H9.5A9.5 9.5 0 0 0 0 28.5z" fill="#A259FF"/>
  </g>
  <text x="108" y="82" font-size="12" letter-spacing="3" fill="#8b949e" font-weight="600">MY HOME TURF</text>

  <!-- headline -->
  <text x="50" y="165" font-size="42" font-weight="700" fill="#ffffff">I think in frames.</text>
  <text x="50" y="213" font-size="42" font-weight="700" fill="#6e7681">I ship in Figma.</text>
  <text x="50" y="250" font-size="15" fill="#8b949e">Wireframes  →  high-fidelity UI  →  interactive prototypes</text>

  <!-- chips -->
  <g font-size="12" font-weight="600" fill="#c9d1d9">
    <rect x="50"  y="272" width="105" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="102.5" y="291" text-anchor="middle">Wireframing</text>
    <rect x="165" y="272" width="84"  height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="207"   y="291" text-anchor="middle">Hi-Fi UI</text>
    <rect x="259" y="272" width="105" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="311.5" y="291" text-anchor="middle">Prototyping</text>
    <rect x="374" y="272" width="84"  height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="416"   y="291" text-anchor="middle">Mockups</text>
  </g>
  <text x="50" y="340" font-size="12" fill="#6e7681">Featured work: SOBAT  ·  SI-DRIPP  ·  @rrboy on Figma</text>

  <!-- artboard: Login -->
  <text x="585" y="104" font-size="11" fill="#6e7681">Login</text>
  <rect x="585" y="112" width="110" height="190" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="603" y="132" width="36" height="8" rx="4" fill="#484f58"/>
  <rect x="603" y="168" width="74" height="16" rx="5" fill="#21262d"/>
  <rect x="603" y="194" width="74" height="16" rx="5" fill="#21262d"/>
  <rect x="603" y="226" width="74" height="18" rx="6" fill="#c9d1d9"/>

  <!-- artboard: Dashboard (selected) -->
  <text x="715" y="74" font-size="11" fill="#6e7681">Dashboard</text>
  <rect x="715" y="82" width="210" height="132" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="727" y="94" width="186" height="10" rx="5" fill="#21262d"/>
  <rect x="727" y="114" width="56" height="30" rx="6" fill="#21262d"/>
  <rect x="789" y="114" width="56" height="30" rx="6" fill="#21262d"/>
  <rect x="851" y="114" width="62" height="30" rx="6" fill="#484f58"/>
  <rect x="727" y="156" width="14" height="44" rx="3" fill="#30363d"/>
  <rect x="747" y="170" width="14" height="30" rx="3" fill="#484f58"/>
  <rect x="767" y="162" width="14" height="38" rx="3" fill="#6e7681"/>
  <rect x="787" y="150" width="14" height="50" rx="3" fill="#8b949e"/>
  <rect x="807" y="166" width="14" height="34" rx="3" fill="#484f58"/>
  <rect x="827" y="158" width="14" height="42" rx="3" fill="#6e7681"/>
  <!-- selection -->
  <rect x="715" y="82" width="210" height="132" rx="10" fill="none" stroke="#0D99FF" stroke-width="1.5"/>
  <g fill="#ffffff" stroke="#0D99FF" stroke-width="1.5">
    <rect x="711" y="78" width="8" height="8" rx="1"/><rect x="921" y="78" width="8" height="8" rx="1"/>
    <rect x="711" y="210" width="8" height="8" rx="1"/><rect x="921" y="210" width="8" height="8" rx="1"/>
  </g>
  <rect x="784" y="224" width="72" height="18" rx="4" fill="#0D99FF"/>
  <text x="820" y="237" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">210 × 132</text>

  <!-- artboard: POS -->
  <text x="715" y="262" font-size="11" fill="#6e7681">POS</text>
  <rect x="715" y="270" width="210" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="727" y="282" width="34" height="26" rx="5" fill="#21262d"/>
  <rect x="767" y="282" width="34" height="26" rx="5" fill="#21262d"/>
  <rect x="807" y="282" width="34" height="26" rx="5" fill="#21262d"/>
  <rect x="727" y="314" width="114" height="20" rx="5" fill="#21262d"/>
  <rect x="853" y="282" width="60" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
  <rect x="859" y="316" width="48" height="12" rx="4" fill="#c9d1d9"/>

  <!-- multiplayer cursor -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -22,14; 6,-6; 0,0" dur="6s" repeatCount="indefinite"/>
    <path d="M868 176 L868 198 L874 192 L879 203 L883 201 L878 191 L886 191 Z" fill="#0D99FF" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="884" y="200" width="34" height="18" rx="9" fill="#0D99FF"/>
    <text x="901" y="213" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Pid</text>
  </g>
</svg>
